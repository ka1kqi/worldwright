[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldwright"
version = "0.0.1"
description = "LLM-authored simulation tasks for Genesis World 1.0 (a modern RoboGen)."
requires-python = ">=3.10,<3.13"
dependencies = [
    "genesis-world>=1.0.0",
    "torch>=2.9.1",
    "numpy",
    "anthropic",
    "pydantic>=2",
    "tyro",
    "rich",
]

[project.optional-dependencies]
dataset = ["lerobot"]
dev = ["pytest", "pytest-xdist", "ruff", "mypy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
